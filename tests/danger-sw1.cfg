!
version 17.6
hostname danger-sw1
!
aaa new-model
!
aaa group server tacacs+ TAC-GRP
 server-private 192.0.2.10 key DangerFixtureKey01
 server-private 192.0.2.11
 ip vrf forwarding MGMT-TYPO
!
aaa authentication login default group TAC-GRP
aaa authentication login VTY-LOGIN group TACGRP local
aaa authentication enable default group TAC-GRP enable
aaa authorization console
aaa authorization exec default group TAC-GRP
aaa authorization exec SPARE-EXEC group tacacs+
aaa authorization commands 15 default group TAC-GRP
!
username admin privilege 15 password 0 DangerFixturePw02
!
ip tacacs source-interface Vlan999
!
interface Vlan100
 ip address 198.51.100.30 255.255.255.0
!
line con 0
 exec-timeout 0 0
line vty 0 4
 authorization exec MISSING-EXEC
 transport input ssh
line vty 5 15
 login authentication VTY-LOGIN
 transport input ssh
!
end
