!
version 15.2
service password-encryption
hostname legacy-sw1
!
enable secret 5 $1$LgFx$LegacyFixtureEnableHash0
!
username breakglass privilege 15 secret 5 $1$LgFx$LegacyFixtureUserHash00
aaa new-model
!
aaa authentication login default local
aaa authentication login VTY-LOGIN group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec VTY-EXEC group tacacs+ if-authenticated
aaa authorization commands 15 VTY-CMD group tacacs+ if-authenticated
aaa accounting exec VTY-EXEC start-stop group tacacs+
aaa accounting commands 15 VTY-CMD start-stop group tacacs+
!
interface Vlan100
 ip address 198.51.100.21 255.255.255.0
!
ip tacacs source-interface Vlan100
tacacs-server host 192.0.2.10 key 7 LegacyFixtureKeyA1104080B0A
tacacs-server host 192.0.2.11 key 7 LegacyFixtureKeyB1104080B0A
!
line con 0
 exec-timeout 5 0
line vty 0 4
 login authentication VTY-LOGIN
 authorization exec VTY-EXEC
 authorization commands 15 VTY-CMD
 accounting exec VTY-EXEC
 accounting commands 15 VTY-CMD
 transport input ssh
line vty 5 15
 login authentication VTY-LOGIN
 authorization exec VTY-EXEC
 authorization commands 15 VTY-CMD
 accounting exec VTY-EXEC
 accounting commands 15 VTY-CMD
 transport input ssh
!
end
